<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/header :: head}"></head>
<body><div th:insert="~{fragments/header :: header}"></div>
<main class="container narrow"><h1>Create Account</h1><p class="error" th:if="${error}" th:text="${error}">Error</p>
<form th:action="@{/register}" th:object="${userRequest}" method="post" class="card">
<label>Name<input th:field="*{name}" required/></label><label>Email<input type="email" th:field="*{email}" required/></label><button type="submit">Register</button>
</form></main><div th:insert="~{fragments/footer :: footer}"></div></body></html>
